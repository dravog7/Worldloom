[package]
name = "worldloom"
version = "0.1.0"
description = "Worldloom — local-first worldbuilding vault"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = { version = "2.7.0", features = ["watch"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-store = "2.5.0"
# Platform credential stores must be opted into explicitly (keyring v3);
# without them the crate silently falls back to an in-memory mock store.
keyring = { version = "3", features = [
  "windows-native",
  "apple-native",
  "linux-native",
  "sync-secret-service",
] }
thiserror = "2"
# AI egress (ADR-006 §1) — the ai_chat proxy. rustls only (NO openssl: no
# default-tls). `blocking` makes the 8MB streaming cap a std::io::Read loop
# and keeps cargo tests tokio-free; the command itself runs on Tauri's
# blocking thread pool via #[tauri::command(async)].
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "blocking",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
